name: Moove CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # The app targets iOS 26 + AlarmKit, which requires Xcode 26.x. The
  # runner image ships several 26.x versions; select the newest installed
  # so the workflow never breaks on image toolchain rotation.
  XCODE_GLOB: "Xcode_26.*"

jobs:
  test-ios:
    name: Test iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "$(echo $XCODE_GLOB)" | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          python3 scripts/patch-scheme-storekit.py

      - name: Run iOS unit tests
        run: |
          xcodebuild test \
            -project Moove.xcodeproj \
            -scheme Moove \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run iOS UI tests
        run: |
          xcodebuild test \
            -project Moove.xcodeproj \
            -scheme MooveUITests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Build iOS (release)
        run: |
          xcodebuild build \
            -project Moove.xcodeproj \
            -scheme Moove \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "$(echo $XCODE_GLOB)" | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Run SwiftLint
        run: |
          brew install swiftlint
          # Fail the build only on serious (error-severity) violations;
          # warnings remain visible in the job log.
          swiftlint

  spm-build:
    name: SPM Build (MooveKit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "$(echo $XCODE_GLOB)" | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: SPM Build
        run: swift build -Xswiftc -strict-concurrency=complete

  spm-test:
    name: SPM Test (MooveKit)
    runs-on: macos-15
    needs: spm-build
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "$(echo $XCODE_GLOB)" | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: SPM Test
        run: swift test -Xswiftc -strict-concurrency=complete
