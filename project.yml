name: Moove
options:
  bundleIdPrefix: com.moove
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  purchases-ios:
    url: https://github.com/RevenueCat/purchases-ios
    from: 4.0.0

targets:
  Moove:
    type: application
    platform: iOS
    info:
      path: Resources/Moove-Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.moove.alarmclock.refresh
        LSApplicationCategoryType: public.app-category.lifestyle
        NSHealthShareUsageDescription: "Moove uses step count to track your wake-up mission."
        NSMotionUsageDescription: "Moove uses motion data to detect steps and shakes during your alarm mission."
        NSMicrophoneUsageDescription: "Moove uses the microphone to detect nearby audio events."
        UIAppFonts:
          - CormorantGaramond-Variable.ttf
          - CormorantGaramond-Italic-Variable.ttf
          - Manrope-Variable.ttf
          - Poppins-SemiBold.ttf
        UIBackgroundModes:
          - audio
          - processing
          - fetch
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: MooveMonogramWhite
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "15"
        ITSAppUsesNonExemptEncryption: false
        "NSAlarmKitUsageDescription": "Moove schedules alarms to wake you up. You must walk to dismiss them."
    sources:
      - path: Sources/Moove
      - path: Resources/Assets.xcassets
      # Individual .caf files land at the app-bundle root so AlarmKit can
      # resolve them for `AlertConfiguration.AlertSound.named(_:)`.
      - path: Resources/Sounds
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Moove.storekit
    dependencies:
      - target: MooveKit
      - package: purchases-ios
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moove.alarmclock
        INFOPLIST_OUTPUT_FORMAT: xml
        COM_MOOVE_APP_GROUP: group.com.moove.alarmclock
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Moove App Store"
          DEVELOPMENT_TEAM: XW22K9BK79
    entitlements:
      path: Resources/Moove.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.moove.alarmclock

  MooveKit:
    type: framework
    platform: iOS
    info:
      path: Sources/MooveKit/Info.plist
    sources:
      - path: Sources/MooveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moove.alarmclock.kit
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        INFOPLIST_OUTPUT_FORMAT: xml

  MooveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MooveTests
      - path: Resources/Moove.storekit
        buildPhase: resources
    dependencies:
      - target: Moove
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MooveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MooveUITests
      - path: Resources/Moove.storekit
        buildPhase: resources
    dependencies:
      - target: Moove
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Unit-test scheme. Its <TestAction> must NOT carry a StoreKit
  # configuration: the subscription tests own StoreKit via SKTestSession,
  # and a scheme-attached config invalidates those sessions.
  Moove:
    build:
      targets:
        Moove: all
        MooveKit: all
    run:
      config: Debug
      storeKitConfiguration: Resources/Moove.storekit
    test:
      config: Debug
      gatherCoverage: false
      commandLineArguments:
        "-DisableStoreKitInit": true
      targets:
        - MooveTests
    archive:
      config: Release

  # UI-test scheme. Carries the StoreKit configuration so paywall flows
  # exercise real sandbox products.
  MooveUITests:
    build:
      targets:
        Moove: all
    run:
      config: Debug
      storeKitConfiguration: Resources/Moove.storekit
    test:
      config: Debug
      storeKitConfiguration: Resources/Moove.storekit
      targets:
        - MooveUITests
    archive:
      config: Release

  MooveKit:
    build:
      targets:
        MooveKit: all


